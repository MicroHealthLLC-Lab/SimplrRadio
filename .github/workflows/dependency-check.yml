# Reports outdated ESP-IDF components and ESP-IDF itself. Report only: it never
# fails a build. Runs weekly and whenever the pinned versions change.
name: Dependency check

on:
  schedule:
    - cron: '0 13 * * 1'  # Mondays 13:00 UTC
  push:
    branches: [main, integration]
    paths:
      - 'dependencies.lock.tab5'
      - 'dependencies.lock.tdeck'
      - 'main/idf_component.*.yml'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'dependencies.lock.tab5'
      - 'dependencies.lock.tdeck'
      - 'main/idf_component.*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outdated:
    name: Outdated libraries
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Check for newer versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_outdated.py
